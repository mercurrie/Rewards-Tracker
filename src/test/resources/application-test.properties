spring.application.name=demo-test

# Use H2 in-memory database for testing with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Force H2 dialect for tests to avoid MySQL-specific DDL generation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Disable the DataLoader for tests
transactions.file.path=src/test/resources/test-transactions.csv

# Use test-specific Log4j configuration
logging.config=classpath:log4j2-test.xml

# Allow overriding if any optional beans missing
spring.main.allow-bean-definition-overriding=true

# Explicitly disable firebase in test profile
firebase.enabled=false
