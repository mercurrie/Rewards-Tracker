<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rewards Tracker — Auth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title text-center">Sign in to Rewards Tracker</h3>

            <div id="user-info" class="mb-3" style="display:none;">
              <p><strong id="display-name"></strong></p>
              <p id="user-email"></p>
              <button id="btn-signout" class="btn btn-outline-secondary">Sign out</button>
            </div>

            <div id="auth-ui">
              <div class="mb-3">
                <button id="btn-google" class="btn btn-primary w-100 mb-2">Sign in with Google</button>
              </div>

              <hr />

              <form id="email-signin-form">
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input id="email" type="email" class="form-control" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input id="password" type="password" class="form-control" required />
                </div>
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-success">Sign in</button>
                  <button id="btn-register" type="button" class="btn btn-outline-success">Register</button>
                </div>
              </form>

              <div class="mt-3">
                <small class="text-muted">After sign-in the app will fetch an ID token and call the backend <code>/api/auth/me</code>.</small>
              </div>
            </div>

            <div id="backend-result" class="mt-4" style="display:none;">
              <h5>Backend response</h5>
              <pre id="backend-json" class="bg-light p-2 border rounded"></pre>
            </div>

            <div id="error" class="mt-3 text-danger" style="display:none;"></div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="/auth/app.js"></script>
</body>
</html>
