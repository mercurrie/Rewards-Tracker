<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rewards Tracker — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row">
      <div class="col-12">
        <h3>Your Dashboard</h3>
        <p id="user-brief" class="text-muted"></p>

        <div class="mb-4">
          <button id="btn-refresh" class="btn btn-primary">Refresh /api/auth/me</button>
          <button id="btn-list-transactions" class="btn btn-secondary">List my transactions</button>
        </div>

        <div id="result" style="display:none;">
          <h5>Result</h5>
          <pre id="result-json" class="bg-light p-2 border rounded"></pre>
        </div>

        <div id="error" class="text-danger" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="/auth/app.js"></script>
  <script>
    document.getElementById('btn-refresh').addEventListener('click', async () => {
      try {
        const token = await firebase.auth().currentUser.getIdToken();
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const json = await res.json();
        document.getElementById('result-json').textContent = JSON.stringify(json, null, 2);
        document.getElementById('result').style.display = 'block';
      } catch (e) {
        document.getElementById('error').textContent = e.message; document.getElementById('error').style.display='block';
      }
    });

    document.getElementById('btn-list-transactions').addEventListener('click', async () => {
      try {
        const token = await firebase.auth().currentUser.getIdToken();
        const res = await fetch('/api/transactions/user/' + encodeURIComponent(firebase.auth().currentUser.email), {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const json = await res.json();
        document.getElementById('result-json').textContent = JSON.stringify(json, null, 2);
        document.getElementById('result').style.display = 'block';
      } catch (e) {
        document.getElementById('error').textContent = e.message; document.getElementById('error').style.display='block';
      }
    });

    // Update brief info when page loads
    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        document.getElementById('user-brief').textContent = user.email + ' — ' + (user.displayName || 'No name');
      } else {
        window.location.href = '/auth/index.html';
      }
    });
  </script>
</body>
</html>
